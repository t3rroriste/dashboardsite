name: Publish live/ to cyqbot.eu

# Renvoie le contenu de `live/` sur l'hébergement LWS, c'est-à-dire sur le
# site en production. C'est l'inverse de `pull-lws.yml`.
#
# CE WORKFLOW PUBLIE. Il ne se déclenche jamais tout seul : ni au push, ni à
# la fusion. Il faut l'ouvrir dans l'onglet Actions, cliquer « Run workflow »
# et taper `publier` dans la case de confirmation.
#
# Le filet de sécurité est `pull-lws.yml` : le site est versionné dans
# `live/`, donc une publication ratée se répare en revenant au commit
# précédent et en republiant.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Tape publier pour confirmer l'envoi sur le site en ligne"
        required: true
        default: ""
      server_dir:
        description: "Dossier distant, relatif au dossier de connexion FTP (= racine web)"
        required: false
        default: "./"
  # « Run workflow » n'apparaît que pour les workflows présents sur la branche
  # par défaut. Tant que celui-ci vit sur une branche de travail, le seul
  # moyen de le lancer est un marqueur : on crée `.github/publish-now`, on
  # pousse, ça publie. Le job se saute de lui-même si le fichier n'est pas là,
  # pour que le commit qui le SUPPRIME ne republie pas.
  push:
    branches:
      - "claude/**"
    paths:
      - ".github/publish-now"

concurrency:
  group: lws-ftp
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the confirmation
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            if [ -f .github/publish-now ]; then
              echo "Marqueur présent : publication."
            else
              echo "Marqueur retiré : rien à publier."
              echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
          elif [ "${{ inputs.confirm }}" != "publier" ]; then
            echo "::error::Confirmation absente : relance en tapant exactement 'publier'."
            exit 1
          fi

      - name: Upload live/ over FTPS
        if: steps.gate.outputs.skip != 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.LWS_FTP_SERVER }}
          username: ${{ secrets.LWS_FTP_USERNAME }}
          password: ${{ secrets.LWS_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./live/
          server-dir: ${{ inputs.server_dir || './' }}
          # Ne vide JAMAIS le dossier distant : le panneau LWS y garde ses
          # propres fichiers, et `live/` ne contient pas tout le serveur.
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
