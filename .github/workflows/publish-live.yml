name: Publish live/ to cyqbot.eu

# Le site en ligne, c'est le contenu de `live/` sur la branche `main`.
#
# Tout push sur `main` qui touche `live/` est publié sur cyqbot.eu dans la
# minute. Autrement dit : `main` EST la production. Pour préparer quelque
# chose sans le publier, travaille sur une autre branche et fusionne quand
# c'est prêt.
#
# Le filet de sécurité est `pull-lws.yml` : le site est versionné, donc une
# publication ratée se répare en revenant au commit d'avant et en poussant.

on:
  push:
    branches: [main]
    paths:
      - "live/**"
  workflow_dispatch:
    inputs:
      server_dir:
        description: "Dossier distant, relatif au dossier de connexion FTP (= racine web)"
        required: false
        default: "./"

# Un seul travail à la fois sur le compte FTP : deux transferts simultanés sur
# le même hébergement mutualisé se marchent dessus.
concurrency:
  group: lws-ftp
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload live/ over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.LWS_FTP_SERVER }}
          username: ${{ secrets.LWS_FTP_USERNAME }}
          password: ${{ secrets.LWS_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./live/
          server-dir: ${{ inputs.server_dir || './' }}
          # Ne vide JAMAIS le dossier distant : le panneau LWS y garde ses
          # propres fichiers, et `live/` ne contient pas tout le serveur.
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
