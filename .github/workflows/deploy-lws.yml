name: Deploy to LWS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-lws
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload to LWS over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.LWS_FTP_SERVER }}
          username: ${{ secrets.LWS_FTP_USERNAME }}
          password: ${{ secrets.LWS_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          # Defaults to a preview subfolder so a misconfigured run can never
          # overwrite the live homepage. Set the LWS_SERVER_DIR repository
          # variable to the web root once the pipeline is proven.
          #
          # The path is relative to the FTP login directory, which on this
          # account IS the web root. The earlier '/www/preview/' therefore
          # created a www/ folder inside the site and published the preview at
          # cyqbot.eu/www/preview/ — that stray folder can be deleted.
          server-dir: ${{ vars.LWS_SERVER_DIR || 'preview/' }}
          # Never wipe the remote directory: LWS keeps panel files there.
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
